# Regenerates the article grid in README.md from articles/index.csv.
#
# Triggered by changes to the manifest or the build script rather than
# on a schedule: the grid is derived data, so it only changes when its
# inputs change. A cron would burn minutes producing no diff.
#
# build-articles.R uses base R only, so no package installation is
# needed and the job finishes in seconds.
name: Build README

on:
  push:
    branches: [main]
    paths:
      - articles/index.csv
      - scripts/build-articles.R
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-readme:
    name: Regenerate article grid
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2

      - name: Rebuild grid
        run: Rscript --vanilla scripts/build-article-grid.R

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached || git commit -m "chore: rebuild article grid"
          git push
