# Re-renders the Quarto articles to GitHub-flavoured markdown, then
# rebuilds the README article grid.
#
# The two steps are combined into one workflow, run as sequential jobs
# via `needs`, because build-article-grid.R checks that every figure
# referenced in articles/index.csv exists on disk. A new article's
# figure is only produced by the render job -- running the grid build
# as a separate, independently-triggered workflow let it race the
# render and fail on a missing file whenever both fired from the same
# push.
#
# Event-driven rather than periodic: both outputs are derived from
# their sources, so nothing changes unless a source changes. The
# weekly cron is a dependency-drift canary -- every article seeds its
# RNG, so a scheduled run producing a diff means a package update
# altered the results, which is worth knowing.
name: Render Articles

on:
  push:
    branches: [main]
    paths:
      - articles/**.qmd
      - articles/Makefile
      - articles/index.csv
      - scripts/build-article-grid.R
  schedule:
    # Weekly, Sunday 06:00 UTC. Deterministic output means a diff here
    # signals a changed dependency, not RNG noise.
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# A long render must not race a second push
concurrency:
  group: render-articles
  cancel-in-progress: false

jobs:
  render:
    name: Render Quarto articles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # helpr is deliberately pinned to github::stufield/helpr -- an
      # unrelated package of the same name exists on CRAN, and `any::`
      # would silently install the wrong one.

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::dplyr
            any::tidyr
            any::tibble
            any::ggplot2
            any::patchwork
            any::withr
            any::randomForest
            any::kknn
            any::sessioninfo
            github::stufield/helpr
            github::stufield/libml
            github::stufield/mixr
            github::stufield/SomaPlotr

      # -B (--always-make) is required: actions/checkout does not
      # preserve mtimes, so every file lands with its checkout timestamp.
      - name: Render
        run: make -C articles -B all

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/*.md articles/figures
          git diff --quiet --cached || git commit -m "chore: re-render articles"
          git push

  # Run even if `render` failed or was a no-op -- a failed render
  # must not silently skip a grid rebuild triggered by a direct
  # index.csv/script change on the same push
  build-readme:
    name: Regenerate article grid
    needs: render    # only delays job start; does not refresh the checkout
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main  # ensure picks up commit that render just pushed 

      - uses: r-lib/actions/setup-r@v2

      - name: Rebuild grid
        run: Rscript --vanilla scripts/build-article-grid.R

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet --cached || git commit -m "chore: rebuild article grid"
          git push
